<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sales Report · MarketHub Admin</title><link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../../css/style.css"><link rel="stylesheet" href="../../css/admin.css"><link rel="stylesheet" href="../../css/responsive.css"></head>
<body data-root="../../" data-page="report-sales" data-title="Sales Report"><div class="app"><aside class="sidebar" data-component="admin-sidebar"></aside><div class="overlay"></div><div class="main"><header class="topbar" data-component="admin-header"></header><main class="content">
<div class="page-head"><div><h1>Sales Report</h1><p>Review sales by date, payment method and top-selling products.</p></div><button class="btn btn-ghost" onclick="window.print()">Print</button></div>
<div class="card report-filter-bar"><div class="toolbar"><div class="field"><label for="date-from">From date</label><input id="date-from" type="date"></div><div class="field"><label for="date-to">To date</label><input id="date-to" type="date"></div><button id="apply-filter" class="btn btn-primary">Apply</button><button id="clear-filter" class="btn btn-ghost">Clear</button></div></div>
<section class="stats-grid"><div class="card stat ok"><div><b id="sales-total">₹0.00</b><span>Total sales</span></div></div><div class="card stat"><div><b id="sales-count">0</b><span>Orders</span></div></div></section>
<div class="card"><h3>Top selling items</h3><div class="table-wrap"><table><thead><tr><th>ID</th><th>Product</th><th class="num">Units</th><th class="num">Revenue</th></tr></thead><tbody id="sales-body"></tbody></table></div></div>
<div class="card" style="margin-top:1rem"><h3>Sales by payment method</h3><div class="table-wrap"><table><thead><tr><th>Method</th><th class="num">Orders</th><th class="num">Revenue</th></tr></thead><tbody id="payment-body"></tbody></table></div></div>
</main><footer class="footer" data-component="admin-footer"></footer></div></div>
<script src="../../services/firebase-config.js"></script><script src="../../services/seed-data.js"></script><script src="../../services/api-service.js"></script><script src="../../services/auth-service.js"></script><script src="../../services/category-service.js"></script><script src="../../services/product-service.js"></script><script src="../../services/customer-service.js"></script><script src="../../services/order-service.js"></script><script src="../../js/validation.js"></script><script src="../../js/main.js"></script><script src="../../js/navigation.js"></script><script src="../../js/sales-report.js"></script>
</body></html>
