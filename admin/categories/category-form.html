<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Category · MarketHub Admin</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/admin.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body data-root="../../" data-page="categories" data-title="Category">
<div class="app">
<aside class="sidebar" data-component="admin-sidebar"></aside>
<div class="overlay"></div>
<div class="main">
<header class="topbar" data-component="admin-header"></header>
<main class="content">
<div class="page-head"><div><h1><span id="form-title">Add category</span></h1><p>All fields marked * are required.</p></div></div><div class="card" style="max-width:820px"><p id="form-state" class="state" hidden>Record not found. <a href="category-list.html">Back to list</a></p>
<form id="category-form" novalidate><div class="form-grid"><div class="field"><label for="ID">Category ID</label><input id="ID" name="ID" type="text" readonly><span class="field-error" data-err="ID"></span></div><div class="field"><label for="Name">Category name *</label><input id="Name" name="Name" type="text" maxlength="60" autocomplete="off"><span class="field-error" data-err="Name"></span></div></div>
<div class="form-actions"><button class="btn btn-primary" type="submit">Save</button><a class="btn btn-ghost" href="category-list.html">Cancel</a></div></form></div>
</main>
<footer class="footer" data-component="admin-footer"></footer>
</div>
</div>
<script src="../../services/firebase-config.js"></script>
<script src="../../services/seed-data.js"></script>
<script src="../../services/api-service.js"></script>
<script src="../../services/auth-service.js"></script>
<script src="../../services/category-service.js"></script>
<script src="../../services/product-service.js"></script>
<script src="../../services/customer-service.js"></script>
<script src="../../js/validation.js"></script>
<script src="../../js/main.js"></script>
<script src="../../js/navigation.js"></script>
<script src="../../js/category.js"></script>
</body>
</html>
