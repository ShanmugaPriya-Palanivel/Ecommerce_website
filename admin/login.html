<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login · MarketHub Admin</title>
<link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/admin.css">
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<main class="login-wrap">
<div class="card login-card">
<div class="brand"><span class="logo">M</span>MarketHub Admin</div>
<h1>Welcome back</h1>
<p class="mock-note" style="margin:.4rem 0 1.25rem"><b>Local demo mode.</b> Use admin@example.com / Admin@123, or enable Firebase in services/firebase-config.js.</p>
<div class="form-error" id="login-error" role="alert" hidden></div>
<form id="login-form" novalidate>
<div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" placeholder="admin@example.com"><span class="field-error" data-err="email"></span></div>
<div class="field" style="margin-top:.6rem"><label for="password">Password</label><div class="pw"><input id="password" name="password" type="password" autocomplete="current-password"><button type="button" id="toggle-pw" aria-pressed="false">Show</button></div><span class="field-error" data-err="password"></span></div>
<button class="btn btn-primary" type="submit" style="width:100%;margin-top:.6rem">Log in</button>
</form>
</div>
</main>
<script src="../services/firebase-config.js"></script>
<script src="../services/seed-data.js"></script>
<script src="../services/api-service.js"></script>
<script src="../services/auth-service.js"></script>
<script src="../js/validation.js"></script>
<script src="../js/login.js"></script>
</body>
</html>
