<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product · MarketHub Admin</title>
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/admin.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body data-root="../../" data-page="inventory" data-title="Product">
<div class="app">
<aside class="sidebar" data-component="admin-sidebar"></aside>
<div class="overlay"></div>
<div class="main">
<header class="topbar" data-component="admin-header"></header>
<main class="content">
<div class="page-head"><div><h1><span id="form-title">Add product</span></h1><p>All fields marked * are required.</p></div></div><div class="card" style="max-width:820px"><p id="form-state" class="state" hidden>Record not found. <a href="inventory-list.html">Back to list</a></p><p id="no-cats" class="form-error" hidden>No categories exist yet. <a href="../categories/category-form.html">Create a category</a> first.</p>
<form id="product-form" novalidate><div class="form-grid"><div class="field"><label for="ID">Product ID</label><input id="ID" name="ID" type="text" readonly><span class="field-error" data-err="ID"></span></div><div class="field"><label for="Cat_ID">Category (Cat_ID) *</label><select id="Cat_ID" name="Cat_ID"></select><span class="field-error" data-err="Cat_ID"></span></div><div class="span-all"><div class="field"><label for="Title">Title *</label><input id="Title" name="Title" type="text" maxlength="100" autocomplete="off"><span class="field-error" data-err="Title"></span></div></div><div class="span-all"><div class="field"><label for="Description">Description</label><textarea id="Description" name="Description" rows="3"></textarea><span class="field-error" data-err="Description"></span></div></div><div class="field"><label for="Quantity">Quantity *</label><input id="Quantity" name="Quantity" type="number" min="0" step="1"><span class=hint>Whole number, 0 or more.</span><span class="field-error" data-err="Quantity"></span></div><div class="field"><label for="Price">Price *</label><input id="Price" name="Price" type="number" min="0" step="0.01"><span class=hint>Must be greater than 0.</span><span class="field-error" data-err="Price"></span></div><div class="span-all"><div class="field"><label for="Image">Image URL or local path</label><input id="Image" name="Image" type="text" autocomplete="off" placeholder="https://example.com/product-photo.jpg"><span class=hint>Paste a public HTTPS image URL, or enter a local project path such as assets/images/products/photo.jpg.</span><span class="field-error" data-err="Image"></span></div><img id="img-preview" class="img-preview" alt="Image preview" style="margin-top:.6rem"></div><div class="span-all"><label class="field" style="flex-direction:row;align-items:center;gap:.7rem"><span class="switch"><input type="checkbox" name="Active" id="Active" checked><span></span></span><b>Active (visible to customers in Phase 3)</b></label></div></div>
<div class="form-actions"><button class="btn btn-primary" type="submit">Save</button><a class="btn btn-ghost" href="inventory-list.html">Cancel</a></div></form></div>
</main>
<footer class="footer" data-component="admin-footer"></footer>
</div>
</div>
<script src="../../services/firebase-config.js"></script>
<script src="../../services/seed-data.js"></script>
<script src="../../services/api-service.js"></script>
<script src="../../services/auth-service.js"></script>
<script src="../../services/category-service.js"></script>
<script src="../../services/product-service.js"></script>
<script src="../../services/customer-service.js"></script>
<script src="../../js/validation.js"></script>
<script src="../../js/main.js"></script>
<script src="../../js/navigation.js"></script>
<script src="../../js/inventory.js"></script>
</body>
</html>
