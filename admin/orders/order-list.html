<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orders · MarketHub Admin</title>
<meta name="description" content="Manage customer orders — view details, update order status and payment status.">
<link rel="icon" href="../../assets/icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/admin.css">
<link rel="stylesheet" href="../../css/responsive.css">
</head>
<body data-root="../../" data-page="orders" data-title="Orders">
<div class="app">
<aside class="sidebar" data-component="admin-sidebar"></aside>
<div class="overlay"></div>
<div class="main">
<header class="topbar" data-component="admin-header"></header>
<main class="content">
<div class="page-head">
  <div><h1>Customer Orders</h1><p>Orders placed through the MarketHub storefront. Update status and mark credit payments.</p></div>
  <a class="btn btn-ghost" href="../reports/sales-report.html">View Sales Report</a>
</div>
<div class="card">
  <div class="toolbar">
    <input type="search" id="order-search" placeholder="Search order ID or customer…">
    <select id="order-status">
      <option value="">All order statuses</option>
      <option>Placed</option><option>Processing</option>
      <option>Shipped</option><option>Delivered</option><option>Cancelled</option>
    </select>
    <select id="order-payment">
      <option value="">All payment methods</option>
      <option value="Cash">Cash</option>
      <option value="Credit">Credit</option>
    </select>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Order ID</th><th>Customer</th><th>Date</th>
          <th>Items</th><th class="num">Total</th>
          <th>Payment</th><th>Order Status</th><th></th>
        </tr>
      </thead>
      <tbody id="orders-body"><tr><td colspan="8" class="state">Loading…</td></tr></tbody>
    </table>
  </div>
</div>
</main>
<footer class="footer" data-component="admin-footer"></footer>
</div>
</div>
<script src="../../services/firebase-config.js"></script>
<script src="../../services/seed-data.js"></script>
<script src="../../services/api-service.js"></script>
<script src="../../services/auth-service.js"></script>
<script src="../../services/category-service.js"></script>
<script src="../../services/product-service.js"></script>
<script src="../../services/customer-service.js"></script>
<script src="../../services/order-service.js"></script>
<script src="../../js/validation.js"></script>
<script src="../../js/main.js"></script>
<script src="../../js/navigation.js"></script>
<script src="../../js/admin-orders.js"></script>
</body>
</html>
